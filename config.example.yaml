# engine-ai runtime config (v0.16) — ten profiles, NOT ten accounts (see upgrade.md §4).
#
# EVERY agent gets its own profile with its own credential_ref (API key) and model_ref.
# Keys give attribution/revocation/spending separation, not extra quota: OpenRouter's
# terms prohibit multiple accounts by one user to circumvent limits, and extra keys do
# not raise rate limits. All keys below share ONE account budget (team-primary) — give
# a profile its own account_group only when it truly belongs to a different account.
#
# Key locations (never paste real keys into this file):
#   env:VAR        resolved from the environment at call time
#   vault:NAME     resolved from the encrypted engine-ai vault (store via set_secret)
#
# Assign per agent without editing this file:
#   engine-ai runtime profiles set frontend --credential-ref vault:OPENROUTER_FRONTEND_KEY --model <id>
#   engine-ai runtime profiles list     # key status (masked), model, agent mapping
#
# Free limits move: configure them from your account's limits page (ENGINE_AI_RPM /
# ENGINE_AI_RPD), don't trust code defaults. Default free-only + no paid fallback.
version: 1
execution:
  max_active_workers: 2
  max_build_processes: 1
  max_model_turns_per_task: 8
routing:
  free_only: true
  paid_fallback: false
  quota_exhausted: pause
agents:
  engine-orchestrator: planner
  engine-app-builder: backend
  engine-mobile: frontend
  engine-deployer: services
  engine-researcher: researcher
  engine-debugger: test-author
profiles:
  planner:
    provider: openrouter
    credential_ref: env:OPENROUTER_PLANNER_KEY
    account_group: team-primary
    model_ref: catalog:validated-planner-model
    input_target_tokens: 12000
    max_output_tokens: 4000
    requires: [tools]
  frontend:
    provider: openrouter
    credential_ref: env:OPENROUTER_FRONTEND_KEY
    account_group: team-primary
    model_ref: catalog:validated-frontend-model
    input_target_tokens: 12000
    max_output_tokens: 4000
    requires: [tools]
  backend:
    provider: openrouter
    credential_ref: env:OPENROUTER_BACKEND_KEY
    account_group: team-primary
    model_ref: catalog:validated-backend-model
    input_target_tokens: 16000
    max_output_tokens: 4000
    requires: [tools]
  services:
    provider: openrouter
    credential_ref: env:OPENROUTER_SERVICES_KEY
    account_group: team-primary
    model_ref: catalog:validated-services-model
    input_target_tokens: 12000
    max_output_tokens: 4000
    requires: [tools]
  database:
    provider: openrouter
    credential_ref: env:OPENROUTER_DATABASE_KEY
    account_group: team-primary
    model_ref: catalog:validated-database-model
    input_target_tokens: 12000
    max_output_tokens: 4000
    requires: [tools]
  test-author:
    provider: openrouter
    credential_ref: env:OPENROUTER_TEST_AUTHOR_KEY
    account_group: team-primary
    model_ref: catalog:validated-test-author-model
    input_target_tokens: 12000
    max_output_tokens: 4000
    requires: [tools]
  reviewer:
    provider: openrouter
    credential_ref: env:OPENROUTER_REVIEWER_KEY
    account_group: team-primary
    model_ref: catalog:validated-review-model
    read_only: true
  security-review:
    provider: openrouter
    credential_ref: env:OPENROUTER_SECURITY_REVIEW_KEY
    account_group: team-primary
    model_ref: catalog:validated-security-review-model
    read_only: true
  researcher:
    provider: openrouter
    credential_ref: env:OPENROUTER_RESEARCHER_KEY
    account_group: team-primary
    model_ref: catalog:validated-researcher-model
    input_target_tokens: 16000
    max_output_tokens: 4000
  documentation:
    provider: openrouter
    credential_ref: env:OPENROUTER_DOCUMENTATION_KEY
    account_group: team-primary
    model_ref: catalog:validated-documentation-model
    input_target_tokens: 8000
    max_output_tokens: 4000
